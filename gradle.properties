# Project-wide Gradle settings.
# Optimized for lower RAM usage while avoiding OOM
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.nonTransitiveRClass=true

# Force D8 to use less memory
android.useFullClasspathForDexingTransform=false

# Run Kotlin compiler in a separate process with limited memory
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmopts=-Xmx768m
